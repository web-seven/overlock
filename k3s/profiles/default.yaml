# Default Overlock environment: Crossplane with cert-manager and Kyverno.
# Packages are served from the nodes' containerd by the image store: loaded by
# the CLI through the images volume, and cached on first use for the listed
# registries.
apiVersion: overlock.app/v1alpha1
kind: Environment
metadata:
  name: OVERLOCK_ENVIRONMENT_NAME
spec:
  imageStore:
    enabled: true
    cache:
      - xpkg.crossplane.io/
      - xpkg.upbound.io/
