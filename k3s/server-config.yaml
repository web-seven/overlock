# Overlock server defaults, installed into /etc/rancher/k3s/config.yaml.d by the
# entrypoint for "server" only (agents reject server options). Traefik is not
# used by Overlock environments and its images are not bundled. Override by
# adding later files to config.yaml.d.
disable:
  - traefik
# The network policy controller stops K3s when the node's IP changed, e.g. after
# "docker compose down" and "up" with a new Compose network, until the node is
# updated; Overlock environments do not use NetworkPolicies.
disable-network-policy: true
