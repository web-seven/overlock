---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: overlock-operator
rules:
- apiGroups:
  - overlock.app
  resources:
  - environments
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - overlock.app
  resources:
  - environments/finalizers
  verbs:
  - update
- apiGroups:
  - overlock.app
  resources:
  - environments/status
  verbs:
  - get
  - patch
  - update
