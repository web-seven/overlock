apiVersion: v1
kind: Namespace
metadata:
  name: system
  labels:
    app.kubernetes.io/name: overlock-operator
    app.kubernetes.io/managed-by: overlock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overlock-operator
  namespace: system
  labels:
    app.kubernetes.io/name: overlock-operator
    app.kubernetes.io/managed-by: overlock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: overlock-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: overlock-operator
    spec:
      serviceAccountName: overlock-operator
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: controller:latest
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          env:
            # The operator reads its own pod to run the image store from
            # its image.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
