name: Release builds

on:
  push:
    tags:
    - '*'

permissions:
    contents: write
    packages: write
    
jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          echo "Current tag: ${{ github.ref_name }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Previous tag/commit: $PREVIOUS_TAG"
          CHANGELOG_CONTENT=$(git log --pretty=format:'* %s (%h)' $PREVIOUS_TAG..${{ github.ref_name }})

          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG_CONTENT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Changelog
            ${{ steps.changelog.outputs.changelog }}
          allowUpdates: true
          # Tags with a pre-release suffix (e.g. 1.2.0-beta.1) never become
          # "latest"; stable tags always do, even when they share a commit
          # with a pre-release (the default "legacy" mode ties on commit date).
          prerelease: ${{ contains(github.ref_name, '-') }}
          makeLatest: ${{ !contains(github.ref_name, '-') }}

  releases-matrix:
    name: Release Go Binary
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64, windows/386, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, windows, darwin]
        goarch: ["386", amd64, arm64]
        exclude:
          - goarch: "386"
            goos: darwin
          - goarch: arm64
            goos: windows
          - goarch: "386"
            goos: windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build and Upload Release Asset
        uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          project_path: "./cmd/cli"
          binary_name: "overlock"
          ldflags: -X "github.com/web-seven/overlock/cmd/cli/version.Version=${{ github.ref_name }}"

  operator-image:
    name: Release Operator Image
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The CLI bootstraps ghcr.io/web-seven/overlock-operator:<its version>;
      # stable releases also update the latest tag used by development builds.
      - name: Build and push operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/web-seven/overlock-operator:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && 'ghcr.io/web-seven/overlock-operator:latest' || '' }}

  k3s-image:
    name: Release Overlock K3s Image
    # Bundles the operator image of this release, so it must be published first.
    needs: operator-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare build context
        id: context
        run: |
          OPERATOR_IMAGE=ghcr.io/web-seven/overlock-operator:${{ github.ref_name }}
          go run ./hack/k3s-image images --operator-image "$OPERATOR_IMAGE" > k3s/images.txt
          go run ./hack/k3s-image manifests --operator-image "$OPERATOR_IMAGE" > k3s/operator.yaml
          echo "k3s_version=$(go run ./hack/k3s-image k3s-version)" >> "$GITHUB_OUTPUT"
          cat k3s/images.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Overlock K3s image
        uses: docker/build-push-action@v6
        with:
          context: k3s
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            K3S_VERSION=${{ steps.context.outputs.k3s_version }}
            OVERLOCK_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/web-seven/overlock-k3s:${{ github.ref_name }}
            ghcr.io/web-seven/overlock-k3s:${{ github.ref_name }}-k3s-${{ steps.context.outputs.k3s_version }}
            ${{ !contains(github.ref_name, '-') && 'ghcr.io/web-seven/overlock-k3s:latest' || '' }}

  notify:
    name: Notify Discord
    needs: releases-matrix
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- $DISCORD_WEBHOOK <<EOF
          {
            "content": "🚀 New release [${{ github.ref_name }}]($RELEASE_URL)"
          }
          EOF
