# Overlock environment with Docker Compose.
#
#   docker compose up -d
#   docker compose ps                      # wait until the k3s service is healthy
#   export KUBECONFIG=$PWD/kubeconfig      # written next to this file
#   kubectl get environments
#
# Settings are read from the environment or an .env file next to this file:
#
#   OVERLOCK_VERSION           image version (default: latest)
#   OVERLOCK_IMAGE             full image reference, overrides OVERLOCK_VERSION
#   OVERLOCK_ENVIRONMENT_NAME  Environment name (default: overlock)
#   OVERLOCK_PROFILE           profile when ./environment.yaml is absent:
#                              default or minimal (default: default)
#   OVERLOCK_BIND_ADDRESS      host address for the ports (default: 127.0.0.1)
#   OVERLOCK_API_PORT          Kubernetes API port (default: 6443)
#   OVERLOCK_HTTP_PORT         host port for 80 (default: 8080)
#   OVERLOCK_HTTPS_PORT        host port for 443 (default: 8443)
#
# This directory is mounted into the container: the kubeconfig is written to
# ./kubeconfig (context named after OVERLOCK_ENVIRONMENT_NAME), and an
# Environment resource in ./environment.yaml (e.g. from "overlock env
# manifest"), if present, replaces the profile.
#
# Other services reach the API at https://k3s:<port> with the kubeconfig in the
# "kubeconfig" volume; see the commented example service below.
name: overlock

services:
  k3s:
    image: ${OVERLOCK_IMAGE:-ghcr.io/web-seven/overlock-k3s:${OVERLOCK_VERSION:-latest}}
    # K3s listens on the published API port, so the exported kubeconfig
    # (https://127.0.0.1:<port>) works from the host.
    # The certificate also covers the service and host names used by other
    # containers.
    command: >-
      server --https-listen-port=${OVERLOCK_API_PORT:-6443}
      --tls-san=k3s --tls-san=overlock
    # A fixed hostname keeps the same K3s node when the container is recreated
    # (e.g. "docker compose down" and "up"); a new hostname would register a
    # second node and leave the workloads of the old one stuck.
    hostname: overlock
    privileged: true
    restart: unless-stopped
    environment:
      OVERLOCK_ENVIRONMENT_NAME: ${OVERLOCK_ENVIRONMENT_NAME:-overlock}
      OVERLOCK_PROFILE: ${OVERLOCK_PROFILE:-default}
      OVERLOCK_ENVIRONMENT_FILE: /overlock/environment.yaml
      OVERLOCK_KUBECONFIG_OUTPUT: /overlock/kubeconfig
      OVERLOCK_KUBECONFIG_CONTEXT: ${OVERLOCK_ENVIRONMENT_NAME:-overlock}
      OVERLOCK_KUBECONFIG_SHARED_OUTPUT: /kubeconfig/config
      OVERLOCK_KUBECONFIG_SHARED_SERVER: https://k3s:${OVERLOCK_API_PORT:-6443}
    ports:
      - ${OVERLOCK_BIND_ADDRESS:-127.0.0.1}:${OVERLOCK_API_PORT:-6443}:${OVERLOCK_API_PORT:-6443}
      - ${OVERLOCK_BIND_ADDRESS:-127.0.0.1}:${OVERLOCK_HTTP_PORT:-8080}:80
      - ${OVERLOCK_BIND_ADDRESS:-127.0.0.1}:${OVERLOCK_HTTPS_PORT:-8443}:443
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      # The directory of this file always exists, so Docker creates nothing.
      - .:/overlock
      # Kubeconfig for other containers (server https://k3s:<port>).
      - kubeconfig:/kubeconfig
      # Images loaded by the Overlock CLI, in a sub-folder of the K3s images
      # directory: K3s imports them into containerd.
      - images:/var/lib/rancher/k3s/agent/images/overlock
    tmpfs:
      - /run
      - /var/run

  # Example service using the Kubernetes API. It starts once the environment
  # is ready and reads the shared kubeconfig. Services of other Compose
  # projects can use the external volume "overlock_kubeconfig" and network
  # "overlock_default" the same way.
  #
  # app:
  #   image: your/app
  #   environment:
  #     KUBECONFIG: /kubeconfig/config
  #   volumes:
  #     - kubeconfig:/kubeconfig:ro
  #   depends_on:
  #     k3s:
  #       condition: service_healthy

volumes:
  k3s-data:
  kubeconfig:
  # Named like the volume the CLI creates for its environments, so "overlock
  # ... load" writes loaded packages here.
  images:
    name: overlock-images-${OVERLOCK_ENVIRONMENT_NAME:-overlock}
